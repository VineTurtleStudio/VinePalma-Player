name: Build VinePalma Player (Linux, Win/Mac Native)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  APP_NAME: VinePalmaPlayer
  VERSION: 0.2.0

jobs:

  # ============================================================
  # 1. LINUX 构建 —— 原生 ubuntu 运行器（不用 Docker，更稳定）
  # ============================================================
  build-linux:
    name: Linux - ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
          - arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install cargo-tauri
        run: cargo install tauri-cli --locked

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: cargo tauri build --target ${{ matrix.rust_target }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VinePalmaPlayer-Linux-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/
          if-no-files-found: error

  # ============================================================
  # 2. WINDOWS 构建
  # ============================================================
  build-windows:
    name: Windows (Native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-tauri
        run: cargo install tauri-cli --locked

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: cargo tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VinePalmaPlayer-Windows
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  # ============================================================
  # 3. MACOS 构建（Intel + Apple Silicon）
  # ============================================================
  build-macos:
    name: macOS - ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-tauri
        run: cargo install tauri-cli --locked

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VinePalmaPlayer-macOS-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error