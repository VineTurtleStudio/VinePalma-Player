version: 2
updates:
  # GitHub Actions 版本维护
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Rust 依赖（src-tauri）
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"

  # npm（当前无依赖，为将来扩展保留）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
